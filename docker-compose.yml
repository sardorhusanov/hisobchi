services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hisobchi
      POSTGRES_USER: hisobchi
      POSTGRES_PASSWORD: hisobchi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisobchi -d hisobchi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
